# Serves the built site on loopback only. cloudflared is the sole client.
worker_processes 2;
pid /run/wishmastercave-web/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;

    client_body_temp_path /run/wishmastercave-web/client_body;
    proxy_temp_path /run/wishmastercave-web/proxy;
    fastcgi_temp_path /run/wishmastercave-web/fastcgi;
    uwsgi_temp_path /run/wishmastercave-web/uwsgi;
    scgi_temp_path /run/wishmastercave-web/scgi;

    # Nothing here accepts input, so requests can stay small and short-lived.
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 127.0.0.1:8080 default_server;
        server_name _;

        root /srv/wishmastercave/current;
        index index.html;
        autoindex off;

        # Keep the internal port out of directory redirects.
        absolute_redirect off;

        expires 10m;

        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube.com https://www.google.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        location / {
            limit_except GET {
                deny all;
            }
            try_files $uri $uri/ =404;
        }
    }
}
